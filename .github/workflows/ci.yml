name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: build + test + cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bağımlılıkları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cppcheck

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --std=c11 \
                   --suppress=missingIncludeSystem \
                   src/
