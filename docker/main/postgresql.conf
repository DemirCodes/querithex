# Querithex — main_database log ayarları (README Bölüm 3)

logging_collector = on
log_line_prefix = '%m [%p] %q%u@%d/%a %h '
log_min_duration_statement = 100
log_statement = 'none'
log_connections = on
log_disconnections = on
log_lock_waits = on
deadlock_timeout = 1s
log_temp_files = 0
log_checkpoints = on
log_min_error_statement = error

# Varsayılanları koru (image'dan gelenler)
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
